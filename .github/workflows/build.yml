name: Build XMillet

on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # miuix 0.9.5-rc02 需要 compileSdk 37.2；AGP 会按需自动下载，这里先接受许可
      - name: Accept Android SDK licenses
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read version name
        run: |
          NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)
          [ -n "$NAME" ] || NAME=dev
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Decode release keystore (optional)
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            umask 077
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "HAS_RELEASE_KEY=1" >> "$GITHUB_ENV"
          else
            echo "::notice::未配置 RELEASE_KEYSTORE_B64，只构建 debug APK"
          fi

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Build release APK
        if: env.HAS_RELEASE_KEY == '1'
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - name: Stage APKs
        run: |
          shopt -s nullglob
          mkdir -p dist
          for f in app/build/outputs/apk/debug/*.apk; do
            cp "$f" "dist/XMillet-debug-v${VERSION_NAME}+${SHORT_SHA}.apk"
            break
          done
          for f in app/build/outputs/apk/release/*.apk; do
            cp "$f" "dist/XMillet-release-v${VERSION_NAME}+${SHORT_SHA}.apk"
            break
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: XMillet-debug-v${{ env.VERSION_NAME }}+${{ env.SHORT_SHA }}
          path: dist/XMillet-debug-*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: env.HAS_RELEASE_KEY == '1'
        uses: actions/upload-artifact@v7
        with:
          name: XMillet-release-v${{ env.VERSION_NAME }}+${{ env.SHORT_SHA }}
          path: dist/XMillet-release-*.apk
          if-no-files-found: warn
